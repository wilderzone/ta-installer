name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      # The CLI has to keep building for both platforms from either one, because the
      # platform split lives in build tags rather than in separate packages.
      - name: Cross-compile
        shell: bash
        run: |
          for target in linux windows; do
            echo "::group::GOOS=$target"
            GOOS=$target GOARCH=amd64 go build -o /dev/null ./tai
            GOOS=$target go vet ./...
            echo "::endgroup::"
          done

      # Separate modules, so ./... in the root doesn't reach them. The launcher runs on
      # both platforms; the other three are Windows-only shims for Explorer.
      - name: Build the installation utilities
        shell: bash
        run: |
          for module in uninstall update verify; do
            (cd "utilities/$module" && GOOS=windows GOARCH=amd64 go build -o /dev/null .)
          done
          for target in linux windows; do
            (cd utilities/play && GOOS=$target GOARCH=amd64 go build -o /dev/null . && GOOS=$target go vet ./...)
          done
          (cd utilities/play && go test -count=1 ./...)

  utilities:
    name: Utilities (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: cd utilities && bash ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: tai-utilities
          path: |
            utilities/dist/Linux/Installer-linux-amd64.json
            utilities/dist/Linux/Installer-linux-amd64.zip
            utilities/dist/Windows/Installer-windows-amd64.json
            utilities/dist/Windows/Installer-windows-amd64.zip
          if-no-files-found: warn

  gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      # Tauri's Linux backend needs the WebKitGTK stack; rpm builds the .rpm bundle.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            build-essential \
            pkg-config \
            patchelf \
            rpm

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      # The embedded CLI is gitignored, and the Rust crate include_bytes!s it, so this
      # has to run before anything touches cargo. `pretauri` also chains it.
      - name: Build the embedded CLI
        working-directory: gui
        run: npm run build-sidecar

      - name: Type-check the frontend
        working-directory: gui
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: gui
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: tai-gui-${{ matrix.os }}
          path: |
            gui/src-tauri/target/release/bundle/**
            gui/src-tauri/target/release/gui
            gui/src-tauri/target/release/gui.exe
          if-no-files-found: warn
