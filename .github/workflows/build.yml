name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      # The CLI has to keep building for both platforms from either one, because the
      # platform split lives in build tags rather than in separate packages.
      - name: Cross-compile
        shell: bash
        run: |
          for target in linux windows; do
            echo "::group::GOOS=$target"
            GOOS=$target GOARCH=amd64 go build -o /dev/null ./tai
            GOOS=$target go vet ./...
            echo "::endgroup::"
          done

      # Separate modules, so ./... in the root doesn't reach them. The launcher runs on
      # both platforms; the other three are Windows-only shims for Explorer.
      - name: Build the installation utilities
        shell: bash
        run: |
          for module in uninstall update verify; do
            (cd "utilities/$module" && GOOS=windows GOARCH=amd64 go build -o /dev/null .)
          done
          for target in linux windows; do
            (cd utilities/play && GOOS=$target GOARCH=amd64 go build -o /dev/null . && GOOS=$target go vet ./...)
          done
          (cd utilities/play && go test -count=1 ./...)

  utilities:
    name: Utilities (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: cd utilities && bash ./build.sh

      # Release tags need these too, for the publish job to download.
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: tai-utilities
          path: |
            utilities/dist/Installer-linux-amd64.json
            utilities/dist/Installer-linux-amd64.zip
            utilities/dist/Installer-windows-amd64.json
            utilities/dist/Installer-windows-amd64.zip
          # A build that produced no package is a failed build, not a warning: the
          # packages are the only reason this job runs.
          if-no-files-found: error

  gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      # Tauri's Linux backend needs the WebKitGTK stack; rpm builds the .rpm bundle.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            build-essential \
            pkg-config \
            patchelf \
            rpm

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      # The embedded CLI is gitignored, and the Rust crate include_bytes!s it, so this
      # has to run before anything touches cargo. `pretauri` also chains it.
      - name: Build the embedded CLI
        working-directory: gui
        run: npm run build-sidecar

      - name: Type-check the frontend
        working-directory: gui
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: gui
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Rename the Linux binary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: mv gui/src-tauri/target/release/tribes-ascend-installer gui/src-tauri/target/release/ta-installer-linux

      - name: Rename the Windows binary
        if: matrix.os == 'windows-latest'
        shell: bash
        run: mv gui/src-tauri/target/release/tribes-ascend-installer.exe gui/src-tauri/target/release/ta-installer-windows.exe

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: tai-gui-${{ matrix.os }}
          path: |
            gui/src-tauri/target/release/ta-installer-linux
            gui/src-tauri/target/release/ta-installer-windows.exe
          if-no-files-found: warn

  # Runs for version tags only, and only once every job above has passed. It's a separate job
  # so the CDN credentials never share a runner with npm or cargo build scripts.
  publish:
    name: Publish to the CDN
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, utilities, gui]
    runs-on: ubuntu-latest
    environment: CDN
    concurrency: cdn
    env:
      # Packages before their asset files, so nobody fetches new checksums for an old package.
      FILES: >-
        ta-installer-linux
        ta-installer-windows.exe
        Installer-linux-amd64.zip
        Installer-windows-amd64.zip
        Installer-linux-amd64.json
        Installer-windows-amd64.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can point at any commit, so check that this one has landed on main.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME doesn't point at a commit on main."
            exit 1
          fi

      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version gui/src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match version $version in tauri.conf.json."
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # Named files rather than `sync --delete`, so unrelated files in the destination directory aren't removed.
      - name: Upload to the CDN
        working-directory: dist
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          DESTINATION: s3://${{ secrets.R2_BUCKET }}/ta/game/installer
        run: |
          for file in $FILES; do
            aws s3 cp "$file" "$DESTINATION/$file" --endpoint-url "$ENDPOINT" --no-progress
          done

      # Cloudflare caches .zip and .exe files at the edge (for two hours by default) but not .json,
      # so without this, `verify` could pair the new checksums with an old package.
      - name: Purge the CDN cache
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CDN_URL: https://cdn.wilderzone.org/ta/game/installer
        run: |
          jq -n --arg base "$CDN_URL/" '{files: [$ARGS.positional[] | $base + .]}' --args $FILES |
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              --header "Authorization: Bearer $TOKEN" \
              --header "Content-Type: application/json" \
              --data @-
